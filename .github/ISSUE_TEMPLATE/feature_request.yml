name: Feature request
description: Propose a scoped improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Best ownership layer
      description: Provider-specific features normally belong in Apprise rather than Checkmk.
      options:
        - Checkmk adapter
        - Apprise routing/configuration
        - Documentation/tooling
        - Unsure
    validations:
      required: true
