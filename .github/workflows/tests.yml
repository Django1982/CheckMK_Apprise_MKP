name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lint
        run: |
          python -m pip install ruff
          ruff check .

      - name: Unit tests
        run: python -m unittest discover -s tests/unit -v

      - name: Build MKP
        run: python scripts/build_mkp.py
