name: Release

# A pushed tag vX.Y.Z builds the MKP from that exact commit and publishes it with a
# SHA-256 checksum as a GitHub release. Pull requests that touch the build or this
# workflow run the same steps as a dry run (nothing is published).
on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "scripts/build_mkp.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-mkp:
    name: release-mkp
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="$(python scripts/build_mkp.py --print-version)"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          }

      - name: Install development tools (pinned)
        run: python -m pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m unittest discover -s tests/unit -v

      - name: Build the MKP twice and compare (reproducibility)
        run: |
          set -euo pipefail
          python scripts/build_mkp.py --output-dir dist
          python scripts/build_mkp.py --output-dir dist-second
          cmp dist/apprise-*.mkp dist-second/apprise-*.mkp
          cat dist/apprise-*.mkp.sha256
          (cd dist && sha256sum -c apprise-*.mkp.sha256)

      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: apprise-mkp
          path: dist/
          if-no-files-found: error

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=""
          case "${GITHUB_REF_NAME}" in v0.*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/*.mkp dist/*.sha256 \
            --verify-tag ${prerelease} \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
